[project]
name = "skrrt"
version = "0.1.0"
description = "Find the single neuron that steers a language model into a persona."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
hf = ["torch", "transformers>=4.45", "accelerate"]
llamacpp = ["gguf", "jinja2"]
dev = ["pytest"]

[project.scripts]
skrrt = "skrrt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skrrt"]
